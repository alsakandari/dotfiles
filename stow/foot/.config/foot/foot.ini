[main]
font=JetBrains Mono Nerd Font:size=9
dpi-aware=yes
pad=10x10

[scrollback]
lines=10000

[url]
launch=xdg-open ${url}

[colors-dark]
background=282c34
foreground=abb2bf

# Normal colors
regular0=282c34   # black
regular1=e06c75   # red
regular2=98c379   # green
regular3=d19a66   # yellow
regular4=61afef   # blue
regular5=c678dd   # magenta
regular6=56b6c2   # cyan
regular7=abb2bf   # white

# Bright colors
bright0=5c6370   # black
bright1=e06c75   # red
bright2=98c379   # green
bright3=e5c07b   # yellow
bright4=61afef   # blue
bright5=c678dd   # magenta
bright6=56b6c2   # cyan
bright7=ffffff   # white

# Selection colors
selection-background=3e4451
selection-foreground=abb2bf
